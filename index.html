<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueille</title>
<style>
:root{--bg:#dfe3e6;--fg:#15191c;--mut:#5d676e;--acc:#1f4fe0;--panel:#fff;--line:#c3cad0;--cols:3;--gap:8px;--row:240px;--body:system-ui,-apple-system,"Segoe UI",sans-serif;--disp:Impact,"Arial Narrow Bold","Haettenschweiler",sans-serif}
body[data-theme="sombre"]{--bg:#101418;--fg:#eef1f3;--mut:#8b979f;--acc:#6f93ff;--panel:#1a2026;--line:#2c353d;--onacc:#0b1020;color-scheme:dark}
body[data-theme="papier"]{--bg:#f1ebe0;--fg:#2a2118;--mut:#7a6a58;--acc:#b5471f;--panel:#fbf7ef;--line:#d9cdb9}
body[data-theme="nuit"]{--bg:#0c1424;--fg:#e9edf5;--mut:#8e9bb5;--acc:#f2b134;--panel:#141e33;--line:#25324d;--onacc:#1a1200;color-scheme:dark}
body[data-theme="stade"]{--bg:#0e2a1c;--fg:#eaf4ec;--mut:#8fb09b;--acc:#c8f23a;--panel:#153523;--line:#234a33;--onacc:#0b1a10;color-scheme:dark}
body[data-theme="piste"]{--bg:#ead9cd;--fg:#2b1a14;--mut:#7d5f52;--acc:#c1380f;--panel:#f6ece4;--line:#d4bcad}
body[data-theme="ocean"]{--bg:#d8ecf2;--fg:#0b2a3a;--mut:#4f7486;--acc:#0a6fa8;--panel:#f2fafc;--line:#b4d3de}
body[data-theme="contraste"]{--bg:#000;--fg:#fff;--mut:#cfcfcf;--acc:#ffd400;--panel:#111;--line:#555;--onacc:#000;color-scheme:dark}
body[data-theme="halloween"]{--bg:#140a1f;--fg:#f4e9dc;--mut:#a58fb5;--acc:#ff7a00;--panel:#1f1230;--line:#3a2354;--onacc:#1a0a00;color-scheme:dark}
body[data-theme="noel"]{--bg:#3a0a12;--fg:#fff4e6;--mut:#e0b9a8;--acc:#f5c542;--panel:#4d1019;--line:#6e1f2b;--onacc:#2a1a00;color-scheme:dark}
body[data-theme="nouvelan"]{--bg:#0a0a0f;--fg:#f6e7b8;--mut:#b8a878;--acc:#e6c15a;--panel:#15151c;--line:#34322a;--onacc:#1a1400;color-scheme:dark}
body[data-theme="travail"]{--bg:#f6f8f3;--fg:#14301f;--mut:#5d7a65;--acc:#c8102e;--panel:#ffffff;--line:#cfdcca}
body[data-theme="valentin"]{--bg:#fde8ee;--fg:#3a0f1e;--mut:#9a5b70;--acc:#d6204f;--panel:#fff5f8;--line:#f0c3d0}
body[data-theme="printemps"]{--bg:#f3f7e6;--fg:#2a3a14;--mut:#5f7442;--acc:#4a7508;--panel:#fcfef5;--line:#d3e0b3}
body[data-theme="ete"]{--bg:#fff3d6;--fg:#3a2a00;--mut:#7a6530;--acc:#06718a;--panel:#fffaf0;--line:#efd9a0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);min-height:100vh}
button,select,input{font:inherit;color:inherit}
select option{background:var(--panel);color:var(--fg)}
#app{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start}
#toc{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 14px;border-right:1px solid var(--line);background:var(--panel)}
#toc .h{margin:0 10px 10px;color:var(--mut);font-size:13px}
#toc a{display:block;padding:6px 10px;border-radius:6px;color:inherit;text-decoration:none}
#toc a:hover{background:var(--bg)}
#toc a.on{background:var(--fg);color:var(--bg)}
#toc .row{display:flex;align-items:center;gap:2px}
#toc .row a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc .mv{display:none;gap:1px}
body.edit #toc .mv{display:inline-flex}
#toc .mv button{background:none;border:0;cursor:pointer;color:var(--mut);padding:2px 4px;border-radius:4px}
#toc .mv button:hover{background:var(--bg);color:var(--fg)}
#newev{margin:12px 10px 0}
#mode{display:block;margin:0 10px 18px}
#export{margin:8px 10px 0}
header{padding:48px 4vw 24px}
#title{font:900 clamp(40px,8vw,110px)/.92 var(--disp);letter-spacing:-.01em;margin:0;outline:none}
header.ev #title{font-size:clamp(34px,6vw,84px)}
#sub{margin:14px 0 0;color:var(--mut);max-width:60ch;outline:none;white-space:pre-wrap}
[contenteditable="true"]:empty:before{content:attr(data-ph);color:var(--mut)}
body.edit #title,body.edit #sub{outline:1px dashed var(--line);outline-offset:6px}
#bar{position:sticky;top:0;z-index:5;background:var(--panel);border-block:1px solid var(--line);padding:10px 4vw;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
#bar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#bar label{color:var(--mut);font-size:13px}
.btn{background:transparent;border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.chip{border:1px solid var(--line);background:transparent;padding:4px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#filters{padding:14px 4vw 0;display:flex;gap:8px;flex-wrap:wrap}
.edit-only{display:none!important}
body.edit .edit-only{display:flex!important}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:calc(var(--gap) + 8px);padding:8px 4vw 28px}
.card{color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 18px}
.card:hover{border-color:var(--acc)}
.card b{display:block;margin-bottom:6px;font:700 24px/1.1 var(--disp)}
.card:hover b{color:var(--acc)}
.card small{color:var(--mut)}
main{padding:var(--gap) 4vw 80px}
#drop{display:none;border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut);margin:14px 0;cursor:pointer}
body.edit #drop{display:block}
body.over #drop{border-color:var(--acc);color:var(--acc)}
.ph{position:relative;overflow:hidden;background:var(--panel);aspect-ratio:var(--r,1.5);cursor:zoom-in}
.ph img,.ph video{display:block;width:100%;height:100%;object-fit:cover}
#grid.rows{display:flex;flex-wrap:wrap;align-items:flex-start;margin:calc(var(--gap)/-2)}
#grid.rows .ph{margin:calc(var(--gap)/2);min-width:0;flex:calc(var(--r)*var(--s,1)*100) 1 calc(var(--r)*var(--s,1)*var(--row))}
#grid.rows .ph.full{flex:1 1 calc(100% - var(--gap))}
#grid.rows::after{content:"";flex-grow:1000000}
#grid.cols{column-count:var(--cols);column-gap:var(--gap)}
#grid.cols .ph{break-inside:avoid;margin-bottom:var(--gap);width:calc(min(var(--s,1),1)*100%)}
#grid.cols .ph.full{column-span:all;width:100%}
#grid.grid{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:0;grid-template-rows:repeat(var(--rows,6),var(--cs,24px));grid-auto-rows:var(--cs,24px);align-items:start;align-content:start;margin:calc(var(--gap)/-2)}
#grid.grid .ph{margin:calc(var(--gap)/2)}
#grid.grid .ph{grid-column:span var(--span,16)}
#grid.grid .ph.off{grid-column:var(--start) / span var(--span,4)}
#grid.grid .ph.full,#grid.grid .ph.txt:not(.box){grid-column:1/-1}
#grid:not(.grid) [data-a="left"],#grid:not(.grid) [data-a="right"]{display:none}
#grid.grid select[data-a="scale"]{display:none}
body.edit #grid.grid{background-image:linear-gradient(to right,rgba(128,140,160,.32) 1px,transparent 1px),linear-gradient(to bottom,rgba(128,140,160,.32) 1px,transparent 1px);background-size:var(--cell,24px) var(--cell,24px)}
#ghost{border:2px dashed;border-radius:4px;pointer-events:none;z-index:6;margin:calc(var(--gap)/2)}
#ghost.ok{background:rgba(31,160,90,.25);border-color:#1fa05a}
#ghost.ko{background:rgba(220,50,50,.25);border-color:#dc3232}
.rz{display:none;position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%);z-index:3;touch-action:none}
body.edit #grid.grid .rz{display:block}
#grid.rows .ph.txt:not(.box){flex:1 1 calc(100% - var(--gap))}
#grid.cols .ph.txt:not(.box){column-span:all}
.ph.txt{overflow:visible;background:none;cursor:auto;padding:0}
.ph.txt,.ph.txt:not(.box){aspect-ratio:auto}
.ph.txt.box{background:none;padding:0}
body.edit .ph.txt{outline:1px dashed var(--line);outline-offset:4px}
.txt .t{outline:none;white-space:pre-wrap;min-height:1.2em}
.txt .t,#title,#sub,.card b,.card small,#toc a{overflow-wrap:anywhere;word-break:break-word}
.ph.txt{min-width:0}
.s-h .t{font:900 clamp(28px,5vw,56px)/1 var(--disp)}
.s-p .t{font-size:17px;line-height:1.4;max-width:70ch}
.s-c .t{font-size:13px;line-height:1.3;color:var(--mut)}
.grip{background:rgba(0,0,0,.78);color:#fff;border-radius:5px;padding:4px 7px;font-size:12px;cursor:grab}
.tag{position:absolute;left:8px;bottom:8px;background:var(--fg);color:var(--bg);padding:2px 9px;border-radius:99px;font-size:12px}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;padding:2px 8px;border-radius:5px;font-size:12px;pointer-events:none}
.badge.raw{display:none}
body.edit .badge.raw{display:block}
.bad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:13px;color:var(--mut);background:var(--panel)}
.ctl{position:absolute;top:8px;right:8px;left:8px;justify-content:flex-end;flex-wrap:wrap;display:none;gap:4px;align-items:center}
body.edit .ctl{display:flex}
.txt .ctl{position:absolute;left:0;right:auto;top:auto;bottom:100%;margin:0 0 4px;padding:4px;width:max-content;max-width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:8;flex-wrap:wrap;justify-content:flex-start}
body.edit .txt .ctl{display:none}
body.edit .ph.txt:hover .ctl,body.edit .ph.txt:focus-within .ctl{display:flex}
.ctl button,.ctl select{background:rgba(0,0,0,.78);color:#fff;border:0;border-radius:5px;padding:4px 7px;cursor:pointer;font-size:12px}
.ctl button:hover{background:var(--acc)}
.ctl option{background:#222;color:#fff}
body.edit .ph{cursor:grab}
body.edit .ph.txt{cursor:auto}
.ph.drag{opacity:.35}
.ph.blank{background:none;cursor:default}
body.edit .ph.blank{outline:1px dashed var(--mut);outline-offset:-1px}
body.edit .ph.blank::before{content:"Espace vide";position:absolute;left:10px;bottom:8px;color:var(--mut);font-size:12px}
.ph.tb::after,.ph.ta::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--acc);z-index:4}
.ph.tb::after{left:0}.ph.ta::after{right:0}
#grid.cols .ph.tb::after,#grid.cols .ph.ta::after{left:0;right:0;width:auto;height:6px;top:auto;bottom:auto}
#grid.cols .ph.tb::after{top:0}#grid.cols .ph.ta::after{bottom:0}
#toc a.dz{outline:2px solid var(--acc);outline-offset:-2px}
.ph.target{outline:3px solid var(--acc);outline-offset:-3px}
#empty{text-align:center;color:var(--mut);padding:50px 0}
#empty.soon{padding:14vh 0}
#empty.soon b{display:block;margin-bottom:12px;color:var(--fg);font:900 clamp(32px,6vw,72px)/1 var(--disp)}
#lb{position:fixed;inset:0;background:rgba(5,7,9,.94);display:none;align-items:center;justify-content:center;z-index:20}
#lb.open{display:flex}
#lb img,#lb video{max-width:94vw;max-height:92vh;object-fit:contain}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:14px;z-index:2}
#lbx{top:6px;right:10px}#lbp{left:6px}#lbn{right:6px}
body:not(.edit) #bar{display:none}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:15}
#settings.open{display:flex}
#settings .sp{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:22px 24px;width:min(460px,92vw);max-height:90vh;overflow:auto}
#settings .sph{display:flex;align-items:center;justify-content:space-between}
#settings h2{margin:0;font:700 28px/1 var(--disp)}
#settings h3{margin:22px 0 4px;font-size:13px;font-weight:600;color:var(--mut)}
#settings .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
#settings .row input[type=range]{width:50%}
#settingsbtn{margin:8px 10px 0}
@media(max-width:800px){
  :root{--row:160px}
  #app{display:block}
  #toc{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  header{padding-top:28px}
}

/* ---------- animations ---------- */
@keyframes rvRise{from{opacity:0;transform:translateY(26px)}}
@keyframes rvFade{from{opacity:0}}
@keyframes rvSlide{from{opacity:0;transform:translateX(-44px)}}
@keyframes rvSlideR{from{opacity:0;transform:translateX(44px)}}
@keyframes lbFade{from{opacity:0}}
@keyframes lbIn{from{opacity:0;transform:scale(.96)}}
.ph img,.ph video{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
body.anim .ph.rv:not(.in){opacity:0}
body.anim .ph.rv.in{animation:rvRise .75s cubic-bezier(.2,.7,.2,1) var(--d,0ms) backwards}
body.anim[data-fx="fade"] .ph.rv.in{animation-name:rvFade}
body.anim[data-fx="slide"] .ph.rv.in{animation-name:rvSlide}
body.anim[data-fx="slide"] .ph.rv.in:nth-child(even){animation-name:rvSlideR}
body.anim:not(.edit) .ph:not(.show):not(.txt):hover img,body.anim:not(.edit) .ph:not(.show):not(.txt):hover video{transform:scale(1.06)}
body.anim #page.pgx header{animation:rvRise .7s cubic-bezier(.2,.7,.2,1) backwards}
body.anim #page.pgx #cards .card{animation:rvRise .6s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*80ms + 150ms) backwards}
body.anim .card{transition:transform .25s,box-shadow .25s,border-color .2s}
body.anim .card:hover{transform:translateY(-5px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
body.anim{transition:background .4s,color .4s}
body.anim #lb.open{animation:lbFade .25s ease}
body.anim #lb img,body.anim #lb video{animation:lbIn .35s cubic-bezier(.2,.7,.2,1)}
#prog{position:fixed;top:0;left:0;right:0;height:3px;background:var(--acc);transform:scaleX(0);transform-origin:left;z-index:30;pointer-events:none}
body:not(.anim) #prog{display:none}
/* ---------- diaporama ---------- */
.ph.show{overflow:visible;cursor:default}
.show .sl{position:absolute;inset:0;overflow:hidden;background:#000;cursor:zoom-in}
body.edit .show .sl{cursor:grab}
.show .sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.show .sl[data-fit="contain"] img{object-fit:contain}
.show .ctl{z-index:6}
#grid.grid .show select[data-a="scale"]{display:inline-block}
.sa{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.45);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:24px;line-height:1;cursor:pointer;opacity:0;transition:opacity .25s,background .2s}
.sa.l{left:10px}.sa.r{right:10px}
.sx{position:absolute;left:10px;bottom:14px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border:0;width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;opacity:0;transition:opacity .25s,background .2s}
.show:hover .sa,.show:hover .sx{opacity:1}
.sa:hover,.sx:hover{background:var(--acc);color:var(--onacc,#fff)}
body.edit .sx{display:none}
@media(hover:none){.sa,.sx{opacity:.85}}
.cnt{position:absolute;right:10px;top:10px;z-index:3;background:rgba(0,0,0,.6);color:#fff;padding:2px 9px;border-radius:99px;font-size:12px;pointer-events:none}
.pbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(0);z-index:3;pointer-events:none}
.strip{display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;gap:4px;padding:4px;overflow-x:auto;background:rgba(0,0,0,.65)}
body.edit .strip{display:flex}
.th{position:relative;flex:none;height:50px;aspect-ratio:1;cursor:pointer;border-radius:3px;overflow:hidden}
.th img{position:static!important;width:100%;height:100%;object-fit:cover;display:block}
.th.now{outline:2px solid var(--acc);outline-offset:-2px}
.th button{position:absolute;background:rgba(0,0,0,.75);color:#fff;border:0;font-size:9px;padding:2px 4px;cursor:pointer;line-height:1}
.th button:hover{background:var(--acc)}
.th [data-a="kl"]{left:0;bottom:0}.th [data-a="kr"]{right:0;bottom:0}.th [data-a="kx"]{right:0;top:0}
.ctl .wl{display:flex;align-items:center;gap:6px;color:#fff;background:rgba(0,0,0,.78);border-radius:5px;padding:3px 8px;font-size:12px}
.ctl .wl input{width:110px;accent-color:var(--acc)}
.ctl .wl span{min-width:34px;text-align:right}
.show .rz{z-index:12;width:28px;height:28px}
.strip{right:32px}
/* ---------- téléphone : même page, sans débordement ni secousses ---------- */
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{overflow-x:clip;overscroll-behavior-x:none}
#page,main{max-width:100%;min-width:0}
button,a,select,.chip{touch-action:manipulation}
@media(hover:none){
  body.anim:not(.edit) .ph:not(.show):not(.txt):hover img,body.anim:not(.edit) .ph:not(.show):not(.txt):hover video{transform:none}
  body.anim .card:hover{transform:none;box-shadow:none}
}
@media(max-width:800px){
  #toc{position:sticky;top:0;z-index:9;height:auto;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #toc::-webkit-scrollbar{display:none}
  #toc .h{display:none}
  #toc .row{flex:none}
  #toc a{flex:none;white-space:nowrap}
  #mode,#newev,#export,#settingsbtn{flex:none;margin:0}
  header{padding:22px 4vw 14px}
  #title{font-size:clamp(30px,11vw,64px)}
  header.ev #title{font-size:clamp(28px,9vw,56px)}
  #cards{grid-template-columns:1fr 1fr;gap:10px;padding-inline:4vw}
  .card{padding:14px 12px}
  .card b{font-size:19px}
  body.anim[data-fx] .ph.rv.in,body.anim[data-fx] .ph.rv.in:nth-child(even){animation-name:rvFade;animation-duration:.45s}
}
</style>
</head>
<body class="" data-theme="nuit" data-fx="rise">
<div id="prog" style="transform: scaleX(0.175866);"></div>
<div id="app">

<nav id="toc" aria-label="Sommaire"></nav>

<div id="page" class="">
  <header id="head" class="ev">
    <h1 id="title" contenteditable="true" data-ph="Nom de l'événement"></h1>
    <p id="sub" contenteditable="true" data-ph="Date, lieu, résultat…"></p>
  </header>

  <div id="bar">
    <div class="grp edit-only">
      <button class="btn main" id="add">Ajouter photos / vidéos</button>
      <button class="btn" id="addtxt">Ajouter un texte</button>
      <button class="btn" id="addblank">Ajouter un espace vide</button>
      <button class="btn" id="addshow">Ajouter un diaporama</button>
    </div>
  </div>

  <div id="cards" hidden=""></div>
  <div id="filters"></div>

  <main>
    <div id="drop">Glisse tes photos, fichiers RAW (.CR2) ou vidéos (.mp4, .mov) ici, ou clique pour les choisir</div>
    <div id="grid" class="grid" style="--cs: 24.479166666666668px; --cell: 24.479166666666668px; --rows: 16;"></div>
    <p id="empty" class=""></p>
  </main>
</div>

</div>

<div id="settings" role="dialog" aria-label="Paramètres" class="">
  <div class="sp">
    <div class="sph"><h2>Paramètres</h2><button class="btn" id="setx">Fermer</button></div>
    <h3>Apparence</h3>
    <div class="row"><label for="theme">Thème du site</label><select id="theme" class="btn"><optgroup label="Classiques"><option value="clair">Clair</option><option value="sombre">Sombre</option><option value="papier">Papier</option><option value="nuit">Nuit</option><option value="stade">Stade</option><option value="piste">Terre battue</option><option value="ocean">Océan</option><option value="contraste">Contraste</option></optgroup><optgroup label="Fêtes"><option value="halloween">Halloween</option><option value="noel">Noël</option><option value="nouvelan">Nouvel An</option><option value="travail">Fête du travail</option><option value="valentin">Saint-Valentin</option><option value="printemps">Printemps</option><option value="ete">Été</option></optgroup></select></div>

(function(){
  const $=s=>document.querySelector(s);

  const STYLES=[['h','Titre'],['p','Paragraphe'],['c','Légende']];
  // Polices installées sur la plupart des ordinateurs : elles marchent sans internet.

  const STACK={arial:'Arial,Helvetica,sans-serif',georgia:'Georgia,"Times New Roman",serif',times:'"Times New Roman",Times,serif',verdana:'Verdana,Geneva,sans-serif',courier:'"Courier New",Courier,monospace',impact:'Impact,"Arial Narrow Bold","Haettenschweiler",sans-serif'};
  const SCALES=[['0.5','Très petit'],['0.75','Petit'],['','Normal'],['1.5','Grand'],['2','Très grand'],['3','Géant'],['full','Pleine largeur']];

  const DEFBODY='system-ui,-apple-system,"Segoe UI",sans-serif';
  let db, photos=[], urls={}, page='home', shown=[], dragId=null, cur=0, tm, noClick=0, inDrag=false;
  const NS=[6,8,12,16,24,48];            // finesses proposées (colonnes de la grille affichée)
  const gU=()=>48/NS[Math.max(0,Math.min(5,S.gi))];   // pas d'accrochage, en colonnes fines (la grille interne en a 48)
  const THEMES=[['clair','Clair'],['sombre','Sombre'],['papier','Papier'],['nuit','Nuit'],['stade','Stade'],['piste','Terre battue'],['ocean','Océan'],['contraste','Contraste'],['halloween','Halloween','f'],['noel','Noël','f'],['nouvelan','Nouvel An','f'],['travail','Fête du travail','f'],['valentin','Saint-Valentin','f'],['printemps','Printemps','f'],['ete','Été','f']];
  const themeOpts=()=>{ const o=x=>'<option value="'+x[0]+'">'+x[1]+'</option>'; return '<optgroup label="Classiques">'+THEMES.filter(x=>!x[2]).map(o).join('')+'</optgroup><optgroup label="Fêtes">'+THEMES.filter(x=>x[2]).map(o).join('')+'</optgroup>'; };
  let S={title:'',sub:'',events:[],layout:'rows',cols:3,gap:8,row:240,dark:false,edit:true,filter:'',titleFont:'impact',bodyFont:'',gi:4,anim:true,fx:'rise'};

  const find=id=>photos.find(x=>x.id===id);
  let cells={}, grab={x:20,y:20};
  let seen=new Set(), pendingSl=null, pgT=null, LL=null;
  const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const animOn=()=>S.anim!==false&&!RM;
  const colsEff=()=>window.innerWidth<600?Math.min(S.cols,2):S.cols;
  const kidsOf=p=>photos.filter(x=>x.sl===p.id).sort((a,b)=>a.order-b.order);
  const curEv=()=>S.events.find(e=>e.id===page);

  const ST=window.PF_STATIC; // défini seulement dans le site exporté
  if(ST) Object.assign(S, ST.settings, {edit:false});
  else try{ Object.assign(S, JSON.parse(localStorage.getItem('pf-settings')||'{}')); }catch(e){}
  if(S.layout!=='cols'&&S.layout!=='grid') S.layout='rows';
  if(!S.theme) S.theme=S.dark?'sombre':'clair';
  if(!(S.gi>=0&&S.gi<=5)) S.gi=4;
  if(!Array.isArray(S.events)) S.events=[];
  const saveS=()=>{ if(ST) return; try{ localStorage.setItem('pf-settings',JSON.stringify(S)); }catch(e){} };

  // ---------- stockage (IndexedDB) ----------
  function open(){
    return new Promise((ok,ko)=>{
      const r=indexedDB.open('pf-photos',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});
      r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error);
    });
  }
  const st=m=>db.transaction('p',m).objectStore('p');
  const getAll=()=>new Promise(ok=>{const r=st('readonly').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>ok([]);});
  const put=p=>{ if(ST) return; try{ st('readwrite').put(p); }catch(e){ console.error(e); } };
  const del=id=>{ try{ st('readwrite').delete(id); }catch(e){ console.error(e); } };
  const url=p=>p.src||urls[p.id]||(urls[p.id]=URL.createObjectURL(p.blob));
  const drop=p=>{ del(p.id); if(urls[p.id]){URL.revokeObjectURL(urls[p.id]);delete urls[p.id];} };
  const ratioOf=p=>{ if(p.ratio){const [a,b]=p.ratio.split('/');return a/b;} return p.nat||1.5; };

  // ---------- navigation ----------
  const pageId=()=>{ const h=location.hash.slice(1); return h.startsWith('e-')&&S.events.some(e=>'e-'+e.id===h)?h.slice(2):'home'; };
  window.addEventListener('hashchange',()=>{
    page=pageId(); S.filter=''; seen.clear();
    const pg=$('#page'); pg.classList.remove('pgx'); void pg.offsetWidth; pg.classList.add('pgx');
    clearTimeout(pgT); pgT=setTimeout(()=>pg.classList.remove('pgx'),1400);
    render(); window.scrollTo(0,0);
  });

  function renderToc(){
    let h=(ST?'':'<button class="btn" id="mode">'+(S.edit?'Aperçu':'Modifier')+'</button>')+'<p class="h">Sommaire</p><a href="#accueil" class="'+(page==='home'?'on':'')+'">Accueil</a>';
    S.events.forEach((ev,i)=>{
      h+='<div class="row"><a href="#e-'+ev.id+'" class="'+(page===ev.id?'on':'')+'">'+esc(ev.name||'Sans titre')+'</a>'+
        '<span class="mv"><button data-m="up" data-i="'+i+'" title="Monter">↑</button><button data-m="down" data-i="'+i+'" title="Descendre">↓</button><button data-m="del" data-i="'+i+'" title="Supprimer l\'événement">✕</button></span></div>';
    });
    h+='<button class="btn edit-only" id="newev">Nouvel événement</button>';
    if(!ST) h+='<button class="btn edit-only" id="export">Exporter le site</button><button class="btn edit-only" id="settingsbtn">Paramètres</button>';
    $('#toc').innerHTML=h;
  }
  $('#toc').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.id==='mode'){ S.edit=!S.edit; saveS(); applyS(); render(); return; }
    if(b.id==='export'){ exportSite(b); return; }
    if(b.id==='settingsbtn'){ $('#settings').classList.add('open'); return; }
    if(b.id==='newev'){
      const n=prompt("Nom de l'événement :"); if(!n||!n.trim()) return;
      const ev={id:uid(),name:n.trim(),sub:''}; S.events.push(ev); saveS(); location.hash='e-'+ev.id; return;
    }
    const i=+b.dataset.i, ev=S.events[i], m=b.dataset.m;
    if(m==='up'&&i>0){ S.events.splice(i-1,0,S.events.splice(i,1)[0]); saveS(); renderToc(); }
    else if(m==='down'&&i<S.events.length-1){ S.events.splice(i+1,0,S.events.splice(i,1)[0]); saveS(); renderToc(); }
    else if(m==='del'){
      if(!confirm('Supprimer « '+(ev.name||'Sans titre')+' » et tout son contenu (photos, vidéos, textes) ?')) return;
      photos.filter(p=>p.ev===ev.id).forEach(drop); photos=photos.filter(p=>p.ev!==ev.id);
      S.events.splice(i,1); saveS();
      if(page===ev.id) location.hash='accueil'; else render();
    }
  });

  // ---------- affichage ----------
  // thème : celui de l'événement s'il en a un, sinon celui du site
  function applyTheme(){
    const ev=curEv(), t=(ev&&ev.theme)||S.theme, ok=THEMES.some(x=>x[0]===t);
    body.dataset.theme=ok?t:'clair';
    $('#theme').value=THEMES.some(x=>x[0]===S.theme)?S.theme:'clair';
    $('#ptheme').value=(ev&&ev.theme)||'';
    $('#pthr').style.display=ev?'':'none';
  }
  function applyS(){
    const r=document.documentElement.style;
    r.setProperty('--cols',colsEff()); r.setProperty('--gap',S.gap+'px'); r.setProperty('--row',S.row+'px');
    r.setProperty('--disp',STACK[S.titleFont]||STACK.impact); r.setProperty('--body',STACK[S.bodyFont]||DEFBODY);
    $('#ft').value=STACK[S.titleFont]?S.titleFont:'impact'; $('#fb').value=STACK[S.bodyFont]?S.bodyFont:'';
    body.classList.toggle('edit',S.edit); applyTheme();
    body.classList.toggle('anim',animOn()); body.dataset.fx=S.fx||'rise';
    $('#anim').checked=S.anim!==false; $('#fx').value=S.fx||'rise';
    grid.classList.toggle('rows',S.layout==='rows'); grid.classList.toggle('cols',S.layout==='cols'); grid.classList.toggle('grid',S.layout==='grid');
    $('#lay').value=S.layout; $('#cols').value=S.cols; $('#gap').value=S.gap; $('#row').value=S.row;
    const rows=S.layout==='rows';
    $('#rowr').style.display=rows?'':'none';
    $('#colsr').style.display=S.layout==='cols'?'':'none';
    $('#gfr').style.display=S.layout==='grid'?'':'none'; $('#gfine').value=S.gi; $('#gfl').textContent='Finesse de la grille ('+NS[S.gi]+' colonnes)';
    $('#title').contentEditable=$('#sub').contentEditable=S.edit;
    layoutGrid();
  }
  function renderHead(){
    const ev=curEv(), t=$('#title'), s=$('#sub');
    $('#head').classList.toggle('ev',!!ev);
    t.textContent=ev?ev.name:S.title; s.textContent=ev?(ev.sub||''):S.sub;
    t.dataset.ph=ev?"Nom de l'événement":'Ton nom';
    s.dataset.ph=ev?'Date, lieu, résultat…':'Photographe de sport. Ajoute ici une courte présentation.';
    document.title=(ev&&ev.name?ev.name+' – ':'')+(S.title||'Portfolio photo sport');
  }
  function renderCards(){
    const c=$('#cards'); c.innerHTML='';
    c.hidden=!(page==='home'&&S.events.length);
    if(c.hidden) return;
    S.events.forEach(ev=>{
      const its=photos.filter(p=>p.ev===ev.id&&p.type!=='text'&&p.type!=='blank'&&p.type!=='show');
      const a=document.createElement('a'); a.className='card'; a.href='#e-'+ev.id; a.style.setProperty('--i',S.events.indexOf(ev));
      const has=photos.some(p=>p.ev===ev.id&&p.type!=='blank'&&!(p.type==='text'&&!(p.text||'').trim()));
      const lab=its.length?its.length+' média'+(its.length>1?'s':''):(has?'':'Cela arrive prochainement');
      a.innerHTML='<b>'+esc(ev.name||'Sans titre')+'</b><small>'+[ev.sub?esc(ev.sub):'',lab].filter(Boolean).join(' · ')+'</small>';
      c.appendChild(a);
    });
  }
  function render(){
    photos.sort((a,b)=>a.order-b.order);
    applyTheme(); renderToc(); renderHead(); renderCards();
    const items=photos.filter(p=>p.ev===page&&!p.sl);
    const tags=[...new Set(items.map(p=>p.tag).filter(Boolean))];
    if(S.filter&&!tags.includes(S.filter)) S.filter='';
    const f=$('#filters'); f.innerHTML='';
    if(tags.length) [''].concat(tags).forEach(t=>{
      const b=document.createElement('button'); b.className='chip'+(S.filter===t?' on':'');
      b.textContent=t||'Tout'; b.onclick=()=>{S.filter=t;render();}; f.appendChild(b);
    });
    shown=items.filter(p=>!S.filter||p.tag===S.filter);
    grid.innerHTML='';
    shown.forEach(p=>{
      if(p.type==='show'&&!S.edit&&!kidsOf(p).length) return;
      grid.appendChild(p.type==='text'?textTile(p):p.type==='blank'?blankTile(p):p.type==='show'?showTile(p):mediaTile(p));

    if(S.edit){
      em.hidden=items.length>0||(home&&S.events.length>0);

    } else {
      em.hidden=real||(home&&S.events.length>0);
      if(!em.hidden){ em.className='soon'; em.innerHTML='<b>Cela arrive prochainement</b><span>Revenez bientôt pour découvrir la suite.</span>'; }
    }
    layoutGrid();
  }

  // Grille libre : la grille interne a 48 colonnes fines et des lignes de la même hauteur (cases carrées).
  // Chaque case a une taille (span) et une position (gx, gy) dans ces unités ; elle ne se pose que sur des places libres.
  // Le curseur « Finesse » ne change que le quadrillage affiché et le pas d'accrochage : rien n'est modifié dans vos cases.
  let cs=24;
  const rectsFree=(r,x,y,w,h)=>x+w<=r.x||r.x+r.w<=x||y+h<=r.y||r.y+r.h<=y;
  const canPlace=(id,x,y,w,h)=>x>=0&&y>=0&&x+w<=48&&Object.keys(cells).every(k=>k===id||rectsFree(cells[k],x,y,w,h));
  function layoutGrid(){
    const tiles=[...grid.querySelectorAll('.ph')];
    if(S.layout!=='grid'){ tiles.forEach(d=>{ d.style.gridColumn=''; d.style.gridRow=''; }); return; }
    const g=S.gap, W=grid.clientWidth, u=gU(); if(!W) return;
    cs=W/48;
    grid.style.setProperty('--cs',cs+'px'); grid.style.setProperty('--cell',(cs*u)+'px');
    const info=tiles.map(d=>{
      const p=find(d.dataset.id), full=d.classList.contains('full')||(d.classList.contains('txt')&&!d.classList.contains('box'));
      const span=full?48:Math.max(1,Math.min(48,p.span||16));
      d.style.gridRow=''; d.style.gridColumn='span '+span;
      return {d,p,span,full};
    });
    const hs=info.map(o=>o.d.getBoundingClientRect().height);
    const placed=[]; cells={};
    const free=(x,y,w,h)=>placed.every(r=>rectsFree(r,x,y,w,h));
    const todo=[];
    info.forEach((o,i)=>{
      o.h=Math.max(1,Math.ceil((hs[i]+g)/cs)); const x=o.full?0:o.p.gx, y=o.p.gy;
      if(Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&y>=0&&x+o.span<=48&&free(x,y,o.span,o.h)){ o.x=x; o.y=y; placed.push({x,y,w:o.span,h:o.h}); }
      else todo.push(o);
    });
    todo.forEach(o=>{
      let done=false;
      for(let y=Number.isInteger(o.p.gy)?o.p.gy:0; !done&&y<4000; y++){
        for(let x=0;x<=48-o.span;x+=u){ if(free(x,y,o.span,o.h)){ o.x=x; o.y=y; placed.push({x,y,w:o.span,h:o.h}); done=true; break; } }
      }
    });
    let maxY=0;
    info.forEach(o=>{
      // on n'enregistre que la place des cases qui n'en avaient pas encore ; un déplacement de secours reste provisoire
      if(!Number.isInteger(o.p.gx)||!Number.isInteger(o.p.gy)){ o.p.gx=o.x; o.p.gy=o.y; put(o.p); }
      o.d.style.gridColumn=(o.x+1)+' / span '+o.span; o.d.style.gridRow=(o.y+1)+' / span '+o.h;
      cells[o.p.id]={x:o.x,y:o.y,w:o.span,h:o.h}; maxY=Math.max(maxY,o.y+o.h);
    });
    grid.style.setProperty('--rows',maxY+(S.edit?16:0));
  }
  // largeur d'une case, en colonnes fines
  function place(d,p){ d.style.setProperty('--span',Math.max(1,Math.min(48,p.span||16))); }
  let lastW=0;
  try{ new ResizeObserver(()=>{ if(grid.clientWidth!==lastW){ lastW=grid.clientWidth; layoutGrid(); } }).observe(grid); }catch(e){}
  try{ document.fonts.ready.then(layoutGrid); }catch(e){}

  function mediaTile(p){
    const d=document.createElement('div'); d.className='ph'; d.dataset.id=p.id; d.draggable=S.edit;
    d.style.setProperty('--r',ratioOf(p)); sized(d,p); place(d,p);
    let m;
    if(p.type==='video'){
      m=document.createElement('video'); m.draggable=false; m.muted=true; m.loop=true; m.playsInline=true; m.preload='metadata'; m.src=url(p)+'#t=0.1';
      m.onerror=()=>{ if(!d.querySelector('.bad')){const x=document.createElement('div');x.className='bad';x.textContent='Vidéo illisible dans ce navigateur (codec non pris en charge)';d.prepend(x);} };
      d.onmouseenter=()=>{ m.play().catch(()=>{}); }; d.onmouseleave=()=>m.pause();

  // ---------- import ----------
  const isVideo=f=>f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(f.name);
  const isRaw=f=>/\.(cr2|cr3|nef|arw|dng|orf|rw2)$/i.test(f.name);
  async function bmp(blob,opt){
    try{ return await createImageBitmap(blob,opt); }catch(e){}
    try{ return await createImageBitmap(blob); }catch(e){ return null; }
  }
  function vmeta(blob){
    return new Promise(ok=>{
      const v=document.createElement('video'), u=URL.createObjectURL(blob); v.preload='metadata'; v.muted=true;
      const end=r=>{URL.revokeObjectURL(u);ok(r);};
      v.onloadedmetadata=()=>end(v.videoWidth&&v.videoHeight?v.videoWidth/v.videoHeight:0);
      v.onerror=()=>end(0); setTimeout(()=>end(0),6000); v.src=u;
    });
  }
  // Un fichier RAW contient un aperçu JPEG : on cherche le plus grand et on le redresse selon l'orientation du boîtier.
  function jpegEnd(b,s){
    let i=s+2;
    while(i<b.length-1){
      if(b[i]!==0xFF){ i++; continue; }
      const m=b[i+1];
      if(m===0xD9) return i+2;
      if(m===0xFF){ i++; continue; }
      if(m===0x00||m===0x01||(m>=0xD0&&m<=0xD7)){ i+=2; continue; }
      i+=2+((b[i+2]<<8)|b[i+3]);
      if(m===0xDA){ while(i<b.length-1&&!(b[i]===0xFF&&b[i+1]!==0&&!(b[i+1]>=0xD0&&b[i+1]<=0xD7))) i++; }
    }
    return b.length;
  }
  async function rawPreview(file){
    const buf=new Uint8Array(await file.arrayBuffer());
    let ori=1;
    try{
      const le=buf[0]===0x49, dv=new DataView(buf.buffer);
      if((buf[0]===0x49||buf[0]===0x4D)&&buf[0]===buf[1]){
        const p=dv.getUint32(4,le), n=dv.getUint16(p,le);
        for(let i=0;i<n;i++){ const e=p+2+i*12; if(dv.getUint16(e,le)===0x112){ ori=dv.getUint16(e+8,le); break; } }
      }
    }catch(e){}
    let best=null, bestOff=0, tried=0;
    for(let i=0;i<buf.length-3&&tried<24;i++){
      if(buf[i]===0xFF&&buf[i+1]===0xD8&&buf[i+2]===0xFF){
        tried++;
        const b=await bmp(file.slice(i,file.size,'image/jpeg'),{imageOrientation:'none'});
        if(b){ if(!best||b.width*b.height>best.width*best.height){ if(best&&best.close)best.close(); best=b; bestOff=i; } else if(b.close) b.close(); }
      }
    }
    if(!best||best.width<400) return null;
    if(ori===1||ori===0){
      // aperçu non pivoté : on garde les octets d'origine du boîtier (aucune perte)
      const exact=file.slice(bestOff,jpegEnd(buf,bestOff),'image/jpeg'), v=await bmp(exact);
      if(v){ if(v.close) v.close(); return {blob:exact,nat:best.width/best.height}; }
    }
    const w=best.width,h=best.height, rot=ori===6||ori===8;
    const c=document.createElement('canvas'); c.width=rot?h:w; c.height=rot?w:h;
    const x=c.getContext('2d');
    if(ori===3){x.translate(w,h);x.rotate(Math.PI);}
    else if(ori===6){x.translate(h,0);x.rotate(Math.PI/2);}
    else if(ori===8){x.translate(0,w);x.rotate(-Math.PI/2);}
    x.drawImage(best,0,0);
    const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.98));
    return blob?{blob,nat:c.width/c.height}:null;
  }
  async function addFiles(files,sl){
    const list=[...files].filter(f=>isVideo(f)||isRaw(f)||f.type.startsWith('image/'));
    if(!list.length&&files.length){ alert('Fichier non pris en charge. Formats acceptés : images, RAW (.CR2…), vidéos .mp4 et .mov.'); return; }
    let o=photos.reduce((m,p)=>Math.max(m,p.order),0), bad=[];
    const dz=$('#drop'), label=dz.textContent, target=page;
    for(let i=0;i<list.length;i++){
      const f=list[i]; dz.textContent='Import '+(i+1)+' / '+list.length+'…';
      try{
        const p={id:uid(),ev:target,order:o+1,ratio:'',tag:sl?'':(S.filter||''),name:f.name};
        if(sl){ p.sl=sl; if(isVideo(f)){ bad.push(f.name+' : les vidéos ne sont pas acceptées dans un diaporama'); continue; } }
        if(isVideo(f)){
          p.type='video'; p.blob=/\.mov$/i.test(f.name)?new Blob([f],{type:'video/mp4'}):f;
          p.nat=await vmeta(p.blob); if(!p.nat){ p.nat=16/9; bad.push(f.name+' : lecture impossible dans ce navigateur (codec)'); }
        } else if(isRaw(f)){
          const r=await rawPreview(f);
          if(!r){ bad.push(f.name+' : aperçu introuvable dans ce fichier RAW'); continue; }
          p.type='image'; p.blob=r.blob; p.nat=r.nat; p.raw=f;
        } else {
          p.type='image'; p.blob=f; const b=await bmp(f); if(b){p.nat=b.width/b.height; if(b.close)b.close();}
        }
        o++; photos.push(p); put(p);
      }catch(e){ console.error(e); bad.push(f.name+" : erreur à l'import"); }
    }
    dz.textContent=label; render();
    if(bad.length) alert('Certains fichiers posent problème :\n\n'+bad.join('\n'));
  }

  });
  grid.addEventListener('dragend',()=>{ inDrag=false; if(dragId){dragId=null;render();} });
  // zone la plus proche du pointeur : on peut lâcher n'importe où, la case s'insère avant ou après la plus proche
  function dropInfo(e){
    let best=null, bd=Infinity, over=false;
    grid.querySelectorAll('.ph').forEach(d=>{
      if(d.dataset.id===dragId) return;
      const r=d.getBoundingClientRect();
      const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right), dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);
      const dist=dx*dx+dy*dy;
      if(dist<bd){ bd=dist; best=d; over=dist===0; }
    });
    if(!best) return null;
    const r=best.getBoundingClientRect();
    const after=S.layout==='cols'?e.clientY>r.top+r.height/2:e.clientX>r.left+r.width/2;
    return {el:best,after,over};
  }
  // position visée en Grille libre (colonne, ligne) et si la place est libre
  function candidate(e){
    const c=cells[dragId]; if(!c) return null;
    const gr=grid.getBoundingClientRect(), u=gU(), g=S.gap;
    const fx=(e.clientX-grab.x-g/2-gr.left)/cs, fy=(e.clientY-grab.y-g/2-gr.top)/cs;
    const x=c.w>=48?0:Math.max(0,Math.min(48-c.w,Math.round(fx/u)*u));
    const y=Math.max(0,Math.round(fy/u)*u);
    return {x,y,w:c.w,h:c.h,ok:canPlace(dragId,x,y,c.w,c.h)};
  }
  const mainEl=$('main');
  mainEl.addEventListener('dragover',e=>{
    if(!dragId) return; e.preventDefault();
    if(S.layout==='grid'){
      const c=candidate(e); if(!c) return;
      let gh=$('#ghost'); if(!gh){ gh=document.createElement('div'); gh.id='ghost'; grid.appendChild(gh); }
      gh.className=c.ok?'ok':'ko'; gh.style.gridColumn=(c.x+1)+' / span '+c.w; gh.style.gridRow=(c.y+1)+' / span '+c.h;
      return;
    }
    grid.querySelectorAll('.tb,.ta').forEach(x=>x.classList.remove('tb','ta'));
    const i=dropInfo(e); if(i) i.el.classList.add(i.after?'ta':'tb');
  });
  mainEl.addEventListener('drop',e=>{
    if(!dragId) return; e.preventDefault(); setTimeout(()=>{inDrag=false;},0);
    if(S.layout==='grid'){
      const c=candidate(e), q=find(dragId);
      if(c&&c.ok&&q){ q.gx=c.x; q.gy=c.y; put(q); }
      dragId=null; render(); return;
    }
    const i=dropInfo(e), p=find(dragId);
    if(i&&p){
      const ids=shown.map(x=>x.id).filter(id=>id!==dragId);
      ids.splice(ids.indexOf(i.el.dataset.id)+(i.after?1:0),0,dragId);
      const slots=shown.map(x=>x.order).sort((a,b)=>a-b);
      ids.forEach((id,k)=>{ const q=find(id); q.order=slots[k]; put(q); });
    }
    dragId=null; render();
  });
  // lâcher une case sur un événement du sommaire la déplace dans cet événement
  const tocEl=$('#toc');
  tocEl.addEventListener('dragover',e=>{
    if(!dragId) return; const a=e.target.closest('a'); tocEl.querySelectorAll('.dz').forEach(x=>x.classList.remove('dz'));
    if(a){ e.preventDefault(); a.classList.add('dz'); }
  });
  tocEl.addEventListener('drop',e=>{
    if(!dragId) return; const a=e.target.closest('a'); if(!a) return; e.preventDefault(); setTimeout(()=>{inDrag=false;},0);
    const h=a.getAttribute('href').slice(1), dest=h==='accueil'?'home':h.replace(/^e-/,''), p=find(dragId);
    dragId=null;
    if(p&&dest!==p.ev){ photos.filter(x=>x.sl===p.id).forEach(k=>{ k.ev=dest; put(k); }); p.ev=dest; delete p.gx; delete p.gy; p.order=photos.reduce((m,x)=>Math.max(m,x.order),0)+1; put(p); }
    render();
  });

  // ---------- actions par élément ----------
  grid.addEventListener('change',e=>{
    const a=e.target.dataset.a; if(!['ratio','style','font','scale','tr','sec','fit'].includes(a)) return;
    const p=find(e.target.closest('.ph').dataset.id);
    if(a==='ratio') p.ratio=e.target.value; else if(a==='font') p.font=e.target.value; else if(a==='scale') p.scale=e.target.value; else if(a==='tr') p.tr=e.target.value; else if(a==='sec') p.sec=+e.target.value; else if(a==='fit') p.fit=e.target.value; else p.style=e.target.value;
    put(p); render();
  });
  grid.addEventListener('click',e=>{
    const d=e.target.closest('.ph'); if(!d) return;
    const p=find(d.dataset.id), a=e.target.dataset.a;
    if(e.target.closest('.rz')||Date.now()<noClick) return;
    if(a==='ratio'||a==='style'||a==='font'||a==='scale'||a==='tr'||a==='sec'||a==='fit') return;
    if(p.type==='show'&&showClick(e,d,p,a)) return;
    if(a==='up'||a==='down'||a==='left'||a==='right'){
      if(S.layout==='grid'){
        const c=cells[p.id], u=gU(), dx=a==='left'?-1:a==='right'?1:0, dy=a==='up'?-1:a==='down'?1:0;
        const nx=dx?(Math.round(c.x/u)+dx)*u:c.x, ny=dy?(Math.round(c.y/u)+dy)*u:c.y;
        if(c&&canPlace(p.id,nx,ny,c.w,c.h)){ p.gx=nx; p.gy=ny; put(p); layoutGrid(); }
      } else if(a==='up'||a==='down') move(p.id,a==='up'?-1:1);
      return;
    }
    if(a==='tag'){ const t=prompt('Sport / catégorie (vide pour retirer) :',p.tag||''); if(t!==null){p.tag=t.trim();put(p);render();} }
    else if(a==='del'){
      if(p.type==='blank'||p.type==='text'&&!(p.text||'').trim()||confirm('Supprimer cet élément ?')){ if(p.type==='show'){ photos.filter(x=>x.sl===p.id).forEach(drop); photos=photos.filter(x=>x.sl!==p.id); } photos=photos.filter(x=>x!==p); drop(p); render(); }
    }
    else if(a==='orig'){ const l=document.createElement('a'); l.href=URL.createObjectURL(p.raw); l.download=p.name; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),4000); }
    else if(p.type!=='text'&&p.type!=='blank') lb(media().indexOf(p),media());
  });

  // ---------- visionneuse ----------
  const media=()=>shown.filter(x=>x.type!=='text'&&x.type!=='blank'&&x.type!=='show');
  function lb(i,list){
    const M=list||LL||media(); LL=M; if(!M.length) return;
    cur=(i+M.length)%M.length; const p=M[cur], im=$('#lb img'), v=$('#lbv');
    [im,v].forEach(x=>{ x.style.animation='none'; void x.offsetWidth; x.style.animation=''; });
    v.pause();
    if(p.type==='video'){ im.style.display='none'; v.style.display='block'; v.src=url(p); v.play().catch(()=>{}); }
    else { v.style.display='none'; v.removeAttribute('src'); v.load(); im.style.display='block'; im.src=url(p); }
    $('#lb').classList.add('open');
  }
  function closeLb(){ LL=null; const v=$('#lbv'); v.pause(); v.removeAttribute('src'); v.load(); $('#lb').classList.remove('open'); }
  let lx=null;
  $('#lb').addEventListener('touchstart',e=>{ lx=e.touches[0].clientX; },{passive:true});
  $('#lb').addEventListener('touchend',e=>{ if(lx===null) return; const dx=e.changedTouches[0].clientX-lx; lx=null; if(Math.abs(dx)>50) lb(cur+(dx<0?1:-1)); },{passive:true});
  $('#lbx').onclick=closeLb;
  $('#lbp').onclick=()=>lb(cur-1); $('#lbn').onclick=()=>lb(cur+1);
  $('#lb').onclick=e=>{ if(e.target.id==='lb') closeLb(); };
  document.addEventListener('keydown',e=>{
    if(!$('#lb').classList.contains('open')) return;
    if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') lb(cur-1); if(e.key==='ArrowRight') lb(cur+1);
  });

  // ---------- barre d'outils et en-tête ----------
  $('#theme').innerHTML=themeOpts();
  $('#ptheme').innerHTML='<option value="">Comme le site</option>'+themeOpts();
  $('#gfine').oninput=e=>{ S.gi=+e.target.value; saveS(); applyS(); };
  $('#theme').onchange=e=>{ S.theme=e.target.value; saveS(); applyTheme(); };
  $('#ptheme').onchange=e=>{ const ev=curEv(); if(ev){ ev.theme=e.target.value; saveS(); applyTheme(); } };
  const closeSet=()=>$('#settings').classList.remove('open');
  $('#setx').onclick=closeSet;
  $('#settings').onclick=e=>{ if(e.target.id==='settings') closeSet(); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSet(); });
  const fopt=(list,sel)=>list.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');
  $('#ft').innerHTML=fopt(FONTS.slice(1)); $('#fb').innerHTML=fopt(FONTS);
  $('#ft').onchange=e=>{S.titleFont=e.target.value;saveS();applyS();};
  $('#fb').onchange=e=>{S.bodyFont=e.target.value;saveS();applyS();};
  $('#lay').onchange=e=>{S.layout=e.target.value;saveS();applyS();};
  ['cols','gap','row'].forEach(k=>{ $('#'+k).oninput=e=>{S[k]=+e.target.value;saveS();applyS();}; });
  $('#anim').onchange=e=>{ S.anim=e.target.checked; saveS(); applyS(); render(); };
  $('#fx').onchange=e=>{ S.fx=e.target.value; saveS(); applyS(); };
  $('#title').oninput=e=>{
    const t=e.target.textContent, ev=curEv();
    if(ev) ev.name=t; else S.title=t;
    saveS(); renderToc(); document.title=(ev&&t?t+' – ':'')+(S.title||'Portfolio photo sport');
  };
  $('#sub').oninput=e=>{ const ev=curEv(); if(ev) ev.sub=e.target.innerText; else S.sub=e.target.innerText; saveS(); };

  // ---------- export du site (zip prêt à publier) ----------
  const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  async function crc32(blob){
    let c=-1;
    for(let o=0;o<blob.size;o+=8<<20){
      const b=new Uint8Array(await blob.slice(o,o+(8<<20)).arrayBuffer());
      for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8);
    }
    return (c^-1)>>>0;
  }
  async function makeZip(files){
    const enc=new TextEncoder(), parts=[], cd=[], d=new Date();
    const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
    let off=0;
    for(const f of files){
      const nm=enc.encode(f.name), size=f.blob.size, c=await crc32(f.blob);
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
      h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,c,true);
      h.setUint32(18,size,true); h.setUint32(22,size,true); h.setUint16(26,nm.length,true);
      parts.push(h.buffer,nm,f.blob);
      const e=new DataView(new ArrayBuffer(46));
      e.setUint32(0,0x02014b50,true); e.setUint16(4,20,true); e.setUint16(6,20,true); e.setUint16(8,0x0800,true);
      e.setUint16(12,tm,true); e.setUint16(14,dt,true); e.setUint32(16,c,true);
      e.setUint32(20,size,true); e.setUint32(24,size,true); e.setUint16(28,nm.length,true); e.setUint32(42,off,true);
      cd.push(e.buffer,nm);
      off+=30+nm.length+size;
    }
    const cdSize=cd.reduce((s,b)=>s+b.byteLength,0);
    const z=new DataView(new ArrayBuffer(22));
    z.setUint32(0,0x06054b50,true); z.setUint16(8,files.length,true); z.setUint16(10,files.length,true);
    z.setUint32(12,cdSize,true); z.setUint32(16,off,true);
    return new Blob([...parts,...cd,z.buffer],{type:'application/zip'});
  }
  async function exportSite(btn){
    const label=btn.textContent; btn.textContent='Préparation…';
    try{
      const items=[], files=[], raws=[]; let n=0;
      for(const p of photos){
        if(p.ev!=='home'&&!S.events.some(e=>e.id===p.ev)) continue;
        if(p.sl&&!photos.some(x=>x.id===p.sl)) continue;
        const q=Object.assign({},p); delete q.blob; delete q.raw;
        if(p.blob){
          btn.textContent='Préparation '+(++n)+'…';
          let blob=p.blob;
          if(p.raw){ raws.push(p); try{ const r=await rawPreview(p.raw); if(r) blob=r.blob; }catch(e){} }
          let ext=(/\.([a-z0-9]{2,5})$/i.exec(p.name||'')||[])[1]; ext=ext?ext.toLowerCase():'';
          if(p.raw||!ext||ext==='mov') ext=p.type==='video'?'mp4':'jpg';
          q.src='media/'+p.id+'.'+ext; files.push({name:q.src,blob});
        }
        items.push(q);
      }
      const data={settings:Object.assign({},S,{edit:false,filter:''}),items};
      const c=document.documentElement.cloneNode(true);
      ['#toc','#grid','#cards','#filters','#empty','#title','#sub'].forEach(s=>{ c.querySelector(s).innerHTML=''; });
      c.removeAttribute('style'); c.querySelector('body').className=''; c.querySelector('#lb').className=''; c.querySelector('#settings').className='';
      c.querySelector('title').textContent=S.title||'Portfolio photo sport';
      const ds=document.createElement('script');
      ds.textContent='window.PF_STATIC='+JSON.stringify(data).replace(/</g,'\\u003c')+';';
      c.querySelector('script').before(ds);
      files.unshift({name:'index.html',blob:new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'})});
      const total=files.reduce((s,f)=>s+f.blob.size,0);
      if(total>3.9e9){ alert('Le site dépasse 4 Go : trop lourd pour être exporté en un seul fichier.'); btn.textContent=label; return; }
      const zip=await makeZip(files);
      const a=document.createElement('a'); a.href=URL.createObjectURL(zip); a.download='portfolio-site.zip'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),10000);
      alert('Export terminé : portfolio-site.zip ('+files.length+' fichiers, '+Math.round(total/1048576)+' Mo).\nDécompressez-le avant de le mettre en ligne.');
      if(raws.length&&confirm('Télécharger aussi une copie de vos '+raws.length+' fichiers RAW d\'origine (.CR2) ?\nC\'est une archive pour vous : ne la publiez pas.')){
        const seen=new Set(), rf=raws.map(p=>{ let nm=p.name||(p.id+'.cr2'); if(seen.has(nm)) nm=p.id+'_'+nm; seen.add(nm); return {name:nm,blob:p.raw}; });
        const z2=await makeZip(rf), b2=document.createElement('a');
        b2.href=URL.createObjectURL(z2); b2.download='portfolio-originaux-raw.zip'; b2.click();
        setTimeout(()=>URL.revokeObjectURL(b2.href),10000);
      }
    }catch(e){ console.error(e); alert("L'export a échoué : "+e.message); }
    btn.textContent=label;
  }

  // ---------- barre de progression du défilement + entrée de page ----------
  window.addEventListener('resize',()=>{ document.documentElement.style.setProperty('--cols',colsEff()); });
  const progEl=$('#prog');
  window.addEventListener('scroll',()=>{ const h=document.documentElement, m=h.scrollHeight-h.clientHeight; progEl.style.transform='scaleX('+(m>0?h.scrollTop/m:0)+')'; },{passive:true});
  $('#page').classList.add('pgx'); pgT=setTimeout(()=>$('#page').classList.remove('pgx'),1400);

  // ---------- démarrage ----------
  applyS();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if(ST){ photos=ST.items||[]; page=pageId(); render(); return; }
  open().then(d=>{db=d;return getAll();}).then(l=>{
    photos=l;
    if(S.gv!==2){   // anciennes positions de la Grille libre : 12 colonnes et demi-lignes -> 48 colonnes fines
      photos.forEach(p=>{ let ch=false; if(p.span){p.span*=4;ch=true;} if(Number.isInteger(p.gx)){p.gx*=4;ch=true;} if(Number.isInteger(p.gy)){p.gy*=2;ch=true;} if(ch) put(p); });
      S.gv=2; saveS();
    }
    // photos ajoutées avec l'ancienne version : rangées dans un premier événement
    const legacy=photos.filter(p=>!p.ev);
    if(legacy.length){
      if(!S.events.length) S.events.push({id:uid(),name:'Galerie',sub:''});
      legacy.forEach(p=>{p.ev=S.events[0].id;put(p);}); saveS();
    }
    page=pageId(); render();
  }).catch(()=>{ $('#empty').hidden=false; $('#empty').textContent="Le stockage des photos n'est pas disponible dans ce navigateur."; });
})();
</script>
